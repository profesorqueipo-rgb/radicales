'use strict';
const names=['Propiedades','Extraer factores','Introducir factores','Operar radicales','Retos combinados'];
const r=(x,n=2)=>`<span class="rad">${n===2?'':`<span class="index">${n}</span>`}<span class="symbol">√</span><span class="inside">${x}</span></span>`;
const pick=a=>a[Math.floor(Math.random()*a.length)],int=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=int(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const coefficient=(a,b,n=2)=>b===1?String(a):`${a===1?'':a===-1?'−':a}${r(b,n)}`;
function simplify(x,n=2){let sign=x<0?-1:1;x=Math.abs(x);let a=1,b=1;for(let p=2;p*p<=x;p++){let e=0;while(x%p===0){x/=p;e++}a*=p**Math.floor(e/n);b*=p**(e%n)}if(x>1)b*=x;return [sign*a,b]}
function q(title,expr,values,labels,format,solution,hint){return{title,expr,values,labels,format,solution,hint}}
function mc(title,expr,correct,wrong,solution,hint){let opts=shuffle([...new Set([correct,...wrong])]);if(opts.length!==4)throw Error('Opciones duplicadas');return{title,expr,opts,correct,solution,hint}}
function generate(){const stages=[];let a,b,c,d,n,s,t,v,A,B;
let props=[];
a=int(3,9);b=int(2,9);props.push(mc('Combina en una sola raíz',`${r(a)} · ${r(b)}`,r(a*b),[r(a+b),r(a*b,4),String(a*b)],`Para radicandos no negativos: √a · √b = √(a·b). Por tanto, ${r(a)} · ${r(b)} = ${r(a*b)}.`,'En un producto de raíces con el mismo índice, multiplica los radicandos.'));
a=int(2,8);b=int(2,8);props.push(mc('Aplica la propiedad del cociente',`${r(a*b)} ÷ ${r(b)}`,r(a),[r(a*b*b),r(a+b),String(a)],`Con denominador positivo, √(a·b) / √b = √a. El resultado es ${r(a)}.`,'Divide los radicandos y conserva el índice.'));
a=int(2,8);props.push(mc('Identifica la afirmación correcta',`${r(a*a+1)}`,`${r(a*a+1)} ≠ ${a} + 1`,[`${r(a*a+1)} = ${a} + 1`,`${r(a*a+1)} = ${a*a+1}`,`${r(a*a+1)} = ${a} + ${r(1)}`],`La raíz de una suma no se reparte. Como (${a}+1)² = ${ (a+1)**2}, que no es ${a*a+1}, la única opción válida es ${r(a*a+1)} ≠ ${a}+1.`,'Comprueba una igualdad elevando ambos lados al cuadrado.'));
a=int(2,7);n=pick([2,3,4]);props.push(mc('Escribe el radical como potencia',r(a,n),`${a}<sup>1/${n}</sup>`,[`${a}<sup>${n}</sup>`,`${a}<sup>${n+1}</sup>`,`${a}<sup>−1/${n}</sup>`],`La raíz de índice n es una potencia de exponente 1/n: ${r(a,n)} = ${a}<sup>1/${n}</sup>.`,'El índice pasa al denominador del exponente.'));
a=int(2,5);props.push(mc('Reduce el índice y el exponente',r(`${a}<sup>2</sup>`,6),r(a,3),[r(a,6),r(a,2),String(a*a)],`Dividimos el índice 6 y el exponente 2 entre 2: ${r(`${a}<sup>2</sup>`,6)} = ${r(a,3)}. La base es positiva.`,'Divide el índice y el exponente por su máximo común divisor.'));stages.push(props);
let ext=[];for(let i=0;i<5;i++){n=[2,2,3,3,4][i];a=int(2,6);b=pick([2,3,5,6,7]);s=i===3?-1:1;v=s*a**n*b;ext.push(q('Extrae todos los factores posibles',r(v,n),[s*a,b],['Factor a','Radicando b'],`Escribe a · ${r('b',n)}. Usa b = 1 si queda un número entero.`,`Descomponemos: ${v} = (${s*a})<sup>${n}</sup> · ${b}. Así, ${r(v,n)} = ${coefficient(s*a,b,n)}.`,n%2===0?'Busca potencias perfectas del índice. Con índice par, la raíz principal es no negativa.':'Busca potencias perfectas del índice. Una raíz de índice impar puede ser negativa.'))}stages.push(ext);
let ins=[];for(let i=0;i<5;i++){n=[2,2,3,3,4][i];a=int(2,7);b=int(2,9);s=i===3?-1:1;v=(s*a)**n*b;ins.push(q('Introduce el factor dentro de la raíz',`${s*a}${r(b,n)}`,[v],['Radicando'],`Escribe una única raíz de índice ${n}; introduce solo el radicando.`,`Elevamos el factor al índice: (${s*a})<sup>${n}</sup> · ${b} = ${v}. Resultado: ${r(v,n)}.`,n%2===0?'Si el factor es positivo, elévalo al índice y multiplica por el radicando.':'Con índice impar también puedes introducir factores negativos.'))}stages.push(ins);
let ops=[];b=pick([2,3,5,7]);a=int(2,7);c=int(2,6);ops.push(q('Suma radicales semejantes',`${a}${r(b)} + ${c}${r(b)}`,[a+c,b],['Factor a','Radicando b'],`Resultado: a · ${r('b')}.`,`Sumamos los factores: (${a}+${c})${r(b)} = ${coefficient(a+c,b)}.`,'Solo se suman directamente los radicales con el mismo índice y radicando.'));
b=pick([2,3,5,7]);a=int(2,6);c=a+int(1,5);ops.push(q('Resta radicales semejantes',`${a}${r(b)} − ${c}${r(b)}`,[a-c,b],['Factor a','Radicando b'],`Resultado: a · ${r('b')}.`,`Restamos los factores: (${a}−${c})${r(b)} = ${coefficient(a-c,b)}.`,'El factor del resultado puede ser negativo.'));
a=int(2,5);c=int(2,5);b=pick([2,3,5,6]);d=pick([2,3,5,7]);[A,B]=simplify(b*d);ops.push(q('Multiplica y simplifica',`${a}${r(b)} · ${c}${r(d)}`,[a*c*A,B],['Factor a','Radicando b'],`Resultado simplificado: a · ${r('b')}. Si es entero, b = 1.`,`Multiplicamos factores y radicandos: ${a*c}${r(b*d)} = ${coefficient(a*c*A,B)}.`,'Multiplica los factores exteriores entre sí y después simplifica la raíz.'));
a=int(2,7);b=pick([2,3,5,7]);c=int(2,5);ops.push(q('Divide y simplifica',`${a*c}${r(b*c*c)} ÷ (${c}${r(b)})`,[a*c],['Resultado entero'],'Introduce el número entero resultante.',`Primero, ${r(b*c*c)} = ${c}${r(b)}. Después se cancelan las raíces iguales y queda ${a*c}.`,'Simplifica la raíz del numerador antes de dividir.'));
b=pick([2,3,5]);a=int(2,5);c=int(2,4);ops.push(q('Simplifica antes de sumar',`${r(a*a*b)} + ${r(c*c*b)}`,[a+c,b],['Factor a','Radicando b'],`Resultado simplificado: a · ${r('b')}.`,`${r(a*a*b)} = ${a}${r(b)} y ${r(c*c*b)} = ${c}${r(b)}. Su suma es ${coefficient(a+c,b)}.`,'Extrae factores de cada raíz para encontrar radicales semejantes.'));stages.push(ops);
let challenges=[];b=pick([2,3,5]);a=int(2,5);c=int(2,5);d=int(1,4);let result=2*a+c-d;challenges.push(q('Combina extracción, suma y resta',`2${r(a*a*b)} + ${r(c*c*b)} − ${d}${r(b)}`,[result,b],['Factor a','Radicando b'],`Resultado: a · ${r('b')}.`,`Extraemos: 2·${a}${r(b)} + ${c}${r(b)} − ${d}${r(b)} = (${2*a}+${c}−${d})${r(b)} = ${coefficient(result,b)}.`,'Simplifica las raíces y luego opera los factores exteriores.'));
a=int(2,7);b=pick([2,3,5,7]);challenges.push(q('Usa la identidad de los conjugados',`(${a} + ${r(b)})(${a} − ${r(b)})`,[a*a-b],['Resultado entero'],'Introduce el número entero resultante.',`Aplicamos (x+y)(x−y)=x²−y²: ${a}² − (${r(b)})² = ${a*a} − ${b} = ${a*a-b}.`,'El producto de una suma por su diferencia es una diferencia de cuadrados.'));
a=int(2,6);b=pick([2,3,5,7]);challenges.push(q('Desarrolla el cuadrado de una suma',`(${a} + ${r(b)})²`,[a*a+b,2*a],['Término entero c','Factor d'],`Resultado: c + d · ${r(b)}.`,`Usamos (x+y)² = x² + 2xy + y². Queda ${a*a} + ${2*a}${r(b)} + ${b} = ${a*a+b} + ${2*a}${r(b)}.`,'No olvides el doble producto de los dos términos.'));
a=int(1,9);b=pick([2,3,5,7]);let gcd=(x,y)=>y?gcd(y,x%y):x;d=gcd(a,b);challenges.push(q('Racionaliza el denominador',`${a} ÷ ${r(b)}`,[a/d,b/d],['Factor a','Denominador d'],`Resultado: (a · ${r(b)}) / d. Simplifica la fracción.`,`Multiplicamos por ${r(b)}/${r(b)}: ${a}${r(b)}/${b}. Al simplificar, queda (${coefficient(a/d,b)})/${b/d}.`,'Multiplica numerador y denominador por la raíz que aparece abajo.'));
a=int(2,5);c=int(2,5);b=2;d=3;challenges.push(q('Agrupa dos tipos de radicales',`${r(a*a*b)} + ${r(c*c*d)} − ${r(b)} + 2${r(d)}`,[a-1,c+2],['Factor a de √2','Factor b de √3'],`Resultado: a · ${r(2)} + b · ${r(3)}.`,`Extraemos: ${a}${r(2)} + ${c}${r(3)} − ${r(2)} + 2${r(3)}. Agrupando, obtenemos ${coefficient(a-1,2)} + ${coefficient(c+2,3)}.`,'Agrupa por separado los términos con √2 y los términos con √3.'));stages.push(challenges);
return stages.flatMap((stage,level)=>shuffle(stage).map(x=>({...x,level})));}
let questions=[],index=0,selected=null,records=[],checked=false;
const main=document.getElementById('main');
const rules=`<details><summary>Recordatorio de propiedades</summary><div class="rules"><p>√a · √b = √(ab) y √a / √b = √(a/b), con a ≥ 0 y b &gt; 0 en el cociente. El producto también admite b = 0. Para otras raíces pares, los radicandos deben ser no negativos.</p><p>ⁿ√(aⁿb) = a · ⁿ√b si a ≥ 0; con índice impar también vale para a negativo. Con índice par, ⁿ√(aⁿ) = |a|.</p><p>a · ⁿ√b = ⁿ√(aⁿb) para a ≥ 0; con índice impar, también para a negativo.</p><p>Las sumas y restas requieren radicales semejantes. √(a+b) no es, en general, √a+√b.</p><p>(x+y)² = x²+2xy+y² · (x+y)(x−y) = x²−y²</p></div></details>`;
function newSession(){questions=generate();index=0;records=[];checked=false;render()}
function render(){selected=null;checked=false;let e=questions[index];document.getElementById('levels').innerHTML=names.map((name,i)=>`<li class="${i===e.level?'active':i<e.level?'done':''}" ${i===e.level?'aria-current="step"':''}>${name}</li>`).join('');main.innerHTML=`<div class="topline"><span class="badge">Nivel ${e.level+1} · ${names[e.level]}</span><span>Ejercicio ${index+1} de 25</span></div><progress max="25" value="${index}" aria-label="Ejercicios completados"></progress><h2>${e.title}</h2><p class="prompt">Resuelve en papel. Introduce tu respuesta y pulsa Comprobar. La nota cuenta el primer intento de cada ejercicio.</p><div class="expression" aria-label="Expresión del ejercicio">${e.expr}</div><form id="answerform"><div class="answer">${e.opts?`<div class="options" role="group" aria-label="Elige una respuesta">${e.opts.map((x,i)=>`<button type="button" class="option" data-choice="${i}" aria-pressed="false"><span class="letter">${'ABCD'[i]}</span><span>${x}</span></button>`).join('')}</div>`:`<div class="format">${e.format}</div><div class="fields">${e.labels.map((x,i)=>`<label>${x}<input id="field${i}" type="text" inputmode="numeric" autocomplete="off" aria-required="true" aria-describedby="alert"></label>`).join('')}</div>`}</div><p class="alert" id="alert" role="alert"></p><div id="feedback" aria-live="polite"></div><div class="actions"><button id="check" type="submit">Comprobar</button><button type="button" class="secondary" id="hint">Ver pista</button><button type="button" class="hidden end" id="next">${index===24?'Ver resultados':'Siguiente ejercicio'}</button></div><p id="hinttext" class="prompt hidden" style="margin-top:18px" aria-live="polite"></p></form>${rules}`;
main.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{if(checked)return;selected=Number(el.dataset.choice);main.querySelectorAll('[data-choice]').forEach(x=>{let active=x===el;x.classList.toggle('selected',active);x.setAttribute('aria-pressed',String(active))})});document.getElementById('answerform').onsubmit=ev=>{ev.preventDefault();check()};document.getElementById('hint').onclick=()=>{let h=document.getElementById('hinttext');h.classList.remove('hidden');h.innerHTML=e.hint};document.getElementById('next').onclick=()=>{index++;if(index===25)results();else render();main.scrollIntoView({behavior:'smooth',block:'start'})};}
function check(){if(checked)return;let e=questions[index],answer,ok;const alert=document.getElementById('alert');if(e.opts){if(selected===null){alert.textContent='Elige una respuesta antes de comprobar.';return}answer=e.opts[selected];ok=answer===e.correct}else{let vals=e.values.map((_,i)=>document.getElementById('field'+i).value.trim().replace('−','-'));if(vals.some(x=>!/^[-+]?\d+$/.test(x)||!Number.isSafeInteger(Number(x)))){alert.textContent='Completa todos los campos con números enteros (puedes usar el signo −).';return}answer=vals.map(Number);ok=answer.every((x,i)=>x===e.values[i])}alert.textContent='';checked=true;records.push({ok,answer});main.querySelectorAll('input,.option').forEach(x=>x.disabled=true);document.getElementById('check').disabled=true;document.getElementById('feedback').className='feedback'+(ok?'':' bad');document.getElementById('feedback').innerHTML=`<h3>${ok?'¡Correcto!':'Revisa el procedimiento'}</h3><p>${e.solution}</p>${!ok?`<p><strong>Respuesta esperada:</strong> ${e.opts?e.correct:e.labels.map((x,i)=>`${x}: ${e.values[i]}`).join(' · ')}</p>`:''}`;document.getElementById('next').classList.remove('hidden');document.getElementById('next').focus()}
function results(){let count=records.filter(x=>x.ok).length;document.getElementById('levels').innerHTML=names.map(x=>`<li class="done">${x}</li>`).join('');main.innerHTML=`<span class="badge">Sesión terminada</span><h2 style="margin-top:16px">Tu resultado</h2><div class="score">${(count*10/25).toFixed(1).replace('.',',')}<span style="font-size:1.3rem"> / 10</span></div><p class="prompt">${count} aciertos de 25 en el primer intento. ${count>=20?'Buen trabajo. Prueba una nueva sesión para seguir afianzando.':'Revisa las explicaciones y vuelve a practicar con ejercicios nuevos.'}</p><table class="results"><thead><tr><th>Contenido</th><th>Aciertos</th></tr></thead><tbody>${names.map((x,l)=>`<tr><td>${x}</td><td>${records.slice(l*5,l*5+5).filter(x=>x.ok).length} / 5</td></tr>`).join('')}</tbody></table><div class="actions"><button id="again">Practicar con nuevos ejercicios</button><button class="secondary" id="reviewbtn">Revisar la sesión</button></div><section id="review" class="hidden"><h2 style="margin-top:30px">Corrección de la sesión</h2>${questions.map((e,i)=>`<article class="review"><strong>${i+1}. ${e.title} · ${records[i].ok?'Correcto':'Para repasar'}</strong><div class="expression">${e.expr}</div><p>Tu respuesta: ${e.opts?records[i].answer:e.labels.map((x,j)=>`${x}: ${records[i].answer[j]}`).join(' · ')}</p><p>${e.solution}</p></article>`).join('')}</section>`;document.getElementById('again').onclick=newSession;document.getElementById('reviewbtn').onclick=()=>document.getElementById('review').classList.toggle('hidden')}
document.getElementById('new').onclick=()=>{if(records.length&&index<25){main.innerHTML=`<h2>¿Empezar otra sesión?</h2><p class="prompt">Se perderán las respuestas de la sesión actual. Los nuevos ejercicios tendrán otros números y otro orden.</p><div class="actions"><button id="confirmnew">Empezar nueva sesión</button><button class="secondary" id="cancelnew">Continuar la sesión actual</button></div>`;document.getElementById('confirmnew').onclick=newSession;document.getElementById('cancelnew').onclick=()=>{render();if(records[index]){let rec=records.pop();if(questions[index].opts){selected=questions[index].opts.indexOf(rec.answer)}else rec.answer.forEach((v,i)=>document.getElementById('field'+i).value=v);check()}}}else newSession()};
newSession();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_radical_practice',description:'Lee el ejercicio visible y el progreso de la práctica de radicales.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({completed:records.length,total:25,level:index<25?names[questions[index].level]:null,title:index<25?questions[index].title:null,correct:records.filter(x=>x.ok).length})})).catch(()=>{})}catch{}}
</script></body></html>
